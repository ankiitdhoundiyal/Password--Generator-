<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Wrapper  -->
     <div>


        <div class="container">


            <h1>Password Generator</h1>

            <div class="display_container">
                <input readonly placeholder="Password" class="display" data-passwordDisplay>

                <button  class="copyBtn">
                    <span class="toolkit" data-copyMsg></span>
                    <img src="./asset/copy.svg" alt="copy" width="23" height="23">
                </button>



            </div>


              <!-- input container -->
            <div class="input-container">

                <!-- password length section  -->

                <div class="length-container">
                    <p>Password Length</p>
                    <p data-legth-number>0</p>
                </div>


                 <!-- slider -->
                <input type="range" min="1" max="20" step="1" class="slider" data-length-slider>


                <!-- check boxes -->
            
                <div class="check" >
                    <input type="checkbox" name="" id="uppercase">
                    <label for="uppercase"> Includes Uppercase letters</label>
                </div>

                <div class="check">
                    <input type="checkbox" name="" id="lowercase">
                    <label for="lowercase"> Includes Lowerrcase letters</label>
                </div>

                <div class="check">
                    <input type="checkbox" name="" id="numbers">
                    <label for="numbers"> Includes Numbers</label>
                </div>

                <div class="check">
                    <input type="checkbox" name="" id="symbols">
                    <label for="symbols"> Includes Symbol</label>
                </div>
                
                <!-- strength section -->

                <div class="strength-container">
                    <p>Strength</p>
                    <div class = "indicator" data-indicator>


                    </div>
                </div>

                <!-- generate password button -->

                <button class="generatebutton">GENERATE PASSWORD</button>

            </div>




        </div>







     </div>
     <script src="script.js"></script>
</body>
</html>
